name: 機能要望
description: Rinkaku に追加してほしい機能や改善案を提案してください。
title: "[機能要望] "
labels:
  - 機能要望
  - 要確認
body:
  - type: markdown
    attributes:
      value: |
        ご提案ありがとうございます。改善したい視聴体験や、現在困っていることが分かるように記載してください。

  - type: checkboxes
    id: checks
    attributes:
      label: 投稿前の確認
      options:
        - label: 既存の Issue に同じ要望がないことを確認しました。
          required: true
        - label: 投稿内容に個人情報、認証情報、非公開の動画内容が含まれていないことを確認しました。
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 改善したい領域
      options:
        - 実写の画質
        - アニメの画質
        - 処理速度・消費電力
        - 対応サイト
        - ポップアップ・設定・ショートカット
        - 他の拡張機能との互換性
        - 試用・購入・ライセンス認証
        - その他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと
      description: どのような場面で困っているか、何を改善したいかを記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望する機能や動作
      description: どのような機能や操作方法があるとよいかを記載してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 現在の代替方法
      description: 現在行っている回避方法や、参考になる他のアプリ・拡張機能の動作があれば記載してください。

  - type: textarea
    id: additional-context
    attributes:
      label: その他の情報
      description: 画面イメージや補足情報があれば、機密情報と非公開の動画内容を取り除いて添付してください。
